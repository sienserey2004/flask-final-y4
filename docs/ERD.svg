</g>
<g><rect x="43" y="454" width="290" height="174" rx="10" fill="#0f172a" opacity=".08"/>
<rect x="40" y="450" width="290" height="174" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
<path d="M40,460 a10,10 0 0 1 10,-10 h270 a10,10 0 0 1 10,10 v34 h-290 z" fill="#334155"/>
<text x="54" y="478" font-size="16" font-weight="700" fill="#fff">AdminUser</text><text x="318" y="478" font-size="11.5" fill="#fff" opacity=".85" text-anchor="end">table: admin_user</text>
<text x="52" y="511" font-size="10.5" font-weight="700" fill="#b45309">PK</text>
<text x="80" y="511" font-size="13" font-weight="600" fill="#0f172a">id</text>
<text x="318" y="511" font-size="11" fill="#64748b" text-anchor="end">INTEGER</text>
<rect x="42" y="520" width="286" height="26" fill="#f8fafc"/>
<text x="80" y="537" font-size="13" font-weight="400" fill="#0f172a">username</text>
<text x="318" y="537" font-size="11" fill="#64748b" text-anchor="end">VARCHAR(80) UNIQUE</text>
<text x="80" y="563" font-size="13" font-weight="400" fill="#0f172a">password_hash</text>
<text x="318" y="563" font-size="11" fill="#64748b" text-anchor="end">VARCHAR(255) (hashed)</text>
<rect x="42" y="572" width="286" height="26" fill="#f8fafc"/>
<text x="80" y="589" font-size="13" font-weight="400" fill="#0f172a">created_at</text>
<text x="318" y="589" font-size="11" fill="#64748b" text-anchor="end">DATETIME</text>
<text x="80" y="615" font-size="13" font-weight="400" fill="#0f172a">last_login</text>
<text x="318" y="615" font-size="11" fill="#64748b" text-anchor="end">DATETIME NULL</text>
</g>
<text x="450" y="560" font-size="13" fill="#334155">• Deleting a product sets order_item.product_id to NULL; name &amp; price are kept as a snapshot,</text>
<text x="450" y="580" font-size="13" fill="#334155">  so order history never breaks.</text>
<text x="450" y="600" font-size="13" fill="#334155">• Each order has exactly one payment record (KHQR bill number + MD5).</text>
<text x="450" y="620" font-size="13" fill="#334155">• AdminUser stores only a password hash (Werkzeug PBKDF2/scrypt), never the plain password.</text>
</svg>