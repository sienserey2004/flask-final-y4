<text x="1138" y="235" font-size="11" fill="#64748b" text-anchor="end">DECIMAL (snapshot)</text>
<rect x="862" y="244" width="286" height="26" fill="#f8fafc"/>
<text x="900" y="261" font-size="13" font-weight="400" fill="#0f172a">quantity</text>
