<text x="1290" y="563" font-size="13" font-weight="400" fill="#0f172a">method</text>
<text x="1528" y="563" font-size="11" fill="#64748b" text-anchor="end">KHQR</text>
<rect x="1252" y="572" width="286" height="26" fill="#f8fafc"/>
<text x="1290" y="589" font-size="13" font-weight="400" fill="#0f172a">amount</text>
<text x="1528" y="589" font-size="11" fill="#64748b" text-anchor="end">DECIMAL(10,2)</text>
<text x="1290" y="615" font-size="13" font-weight="400" fill="#0f172a">currency</text>
<text x="1528" y="615" font-size="11" fill="#64748b" text-anchor="end">USD | KHR</text>
<rect x="1252" y="624" width="286" height="26" fill="#f8fafc"/>
<text x="1290" y="641" font-size="13" font-weight="400" fill="#0f172a">bill_number</text>
<text x="1528" y="641" font-size="11" fill="#64748b" text-anchor="end">VARCHAR(40)</text>
<text x="1290" y="667" font-size="13" font-weight="400" fill="#0f172a">khqr_md5</text>
<text x="1528" y="667" font-size="11" fill="#64748b" text-anchor="end">VARCHAR(64)</text>
<rect x="1252" y="676" width="286" height="26" fill="#f8fafc"/>
<text x="1290" y="693" font-size="13" font-weight="400" fill="#0f172a">status</text>
<text x="1528" y="693" font-size="11" fill="#64748b" text-anchor="end">unverified|paid|refunded|void</text>
<text x="1290" y="719" font-size="13" font-weight="400" fill="#0f172a">paid_at</text>
<text x="1528" y="719" font-size="11" fill="#64748b" text-anchor="end">DATETIME NULL</text>
<rect x="1252" y="728" width="286" height="26" fill="#f8fafc"/>
<text x="1290" y="745" font-size="13" font-weight="400" fill="#0f172a">created_at</text>
