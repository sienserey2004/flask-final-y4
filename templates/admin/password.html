{% extends 'admin/base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Change password</h1>
<form method="post" class="card border-0 shadow-sm" style="max-width:440px"><div class="card-body">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="current" required></div>
  <div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" name="new" minlength="8" required><div class="form-text">At least 8 characters. Stored as a secure hash, never in plain text.</div></div>
  <div class="mb-3"><label class="form-label">Confirm new password</label><input class="form-control" type="password" name="confirm" minlength="8" required></div>
  <button class="btn btn-brand"><i class="bi bi-key"></i> Update password</button>
</div></form>
{% endblock %}
