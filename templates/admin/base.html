<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} — {{ shop_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  <style>:root{--brand:{{ brand_color }};}</style>
</head>
<body>
<div class="d-flex admin-wrap">
  <aside class="admin-side py-3">
    <div class="text-white fw-bold px-3 mb-1"><i class="bi bi-shop"></i> {{ shop_name }} Admin</div>
    <div class="small text-secondary px-3 mb-3"><i class="bi bi-person-circle"></i> {{ admin_name }}</div>
    <a href="{{ url_for('admin_orders') }}" class="{{ 'active' if request.endpoint.startswith('admin_order') }}"><i class="bi bi-receipt"></i> Orders</a>
    <a href="{{ url_for('admin_products') }}" class="{{ 'active' if request.endpoint.startswith('admin_product') }}"><i class="bi bi-box-seam"></i> Products</a>
    <a href="{{ url_for('admin_categories') }}" class="{{ 'active' if request.endpoint.startswith('admin_categor') }}"><i class="bi bi-tags"></i> Categories</a>
    <a href="{{ url_for('admin_password') }}" class="{{ 'active' if request.endpoint == 'admin_password' }}"><i class="bi bi-key"></i> Change password</a>
    <a href="{{ url_for('home') }}" target="_blank"><i class="bi bi-box-arrow-up-right"></i> View store</a>
    <form method="post" action="{{ url_for('admin_logout') }}" class="px-2 mt-3">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <button class="btn btn-sm btn-outline-light w-100"><i class="bi bi-box-arrow-right"></i> Log out</button>
    </form>
  </aside>
  <div class="flex-grow-1 p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
