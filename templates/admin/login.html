<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login — {{ shop_name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"><style>:root{--brand:{{ brand_color }};}</style></head>
<body class="bg-dark d-flex align-items-center" style="min-height:100vh">
<div class="container" style="max-width:400px">
  <div class="card shadow border-0"><div class="card-body p-4">
    <h1 class="h4 text-center mb-3">{{ shop_name }} Admin</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }} py-2">{{ msg }}</div>{% endfor %}{% endwith %}
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-brand w-100">Sign in</button>
    </form>
    <div class="text-center mt-3"><a href="{{ url_for('home') }}" class="small">← Back to store</a></div>
  </div></div>
</div></body></html>
